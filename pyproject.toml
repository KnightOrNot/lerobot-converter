[project]
name = "lerobot-recorder"
version = "0.1.0"
description = "Convert PiPER-X/GELLO raw sessions to LeRobot Dataset v3"
readme = "README.md"
authors = [
    { name = "RightOrNot", email = "jue1251665735@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dataset = [
    "lerobot[dataset]==0.6.1",
    "torch>=2.2.1,<2.12",
    "torchvision>=0.21,<0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
lerobot-recorder = "lerobot_recorder:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
